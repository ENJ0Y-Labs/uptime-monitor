name = "apimon-monitor-worker"
main = "src/index.js"
compatibility_date = "2026-11-10"
keep_vars = true

[observability]
enabled = true

[vars]
# Explicit operator-approved hostname allowlist. Add entries only after security review.
APIMON_ALLOWED_TARGET_HOSTS = "retailos-server.onrender.com"

[[d1_databases]]
binding = "APIMON_DB"
database_name = "apimon-db"
# Confirm this ID belongs to the intended Cloudflare account before production deployment.
database_id = "58a773e8-748c-441c-8a99-3896c27afa6b"
migrations_dir = "migrations"

[triggers]
# Poll due monitors every minute so all supported per-monitor intervals remain accurate.
crons = ["* * * * *"]
