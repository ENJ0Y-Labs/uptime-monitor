name = "apimon-monitor-worker"
main = "src/index.js"
compatibility_date = "2026-11-09"
keep_vars = true

[[d1_databases]]
binding = "APIMON_DB"
database_name = "uptime-monitor-db"
# Replace this placeholder with the database_id returned by: npx wrangler d1 create apimon-db
database_id = "9d2c6541-b219-4000-90e8-c95c8408ce6a"
migrations_dir = "migrations"

[triggers]
# Poll due monitors every minute; each monitor's interval is enforced in D1.
crons = ["* * * * *"]
