name: Deploy APIMON

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "frontend/**"
      - "docs/DEPLOYMENT.md"
      - ".github/workflows/deploy.yml"
      - "wrangler.jsonc"

permissions:
  contents: read

concurrency:
  group: apimon-production-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy Worker and D1 migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - name: Apply production D1 migrations
        run: npm run db:migrate:remote
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy monitoring Worker
        run: npm run deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    name: Build and deploy dashboard
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build dashboard
        run: npm run build
        working-directory: frontend
        env:
          VITE_APIMON_API_BASE_URL: ${{ vars.APIMON_API_BASE_URL }}
      - name: Publish Cloudflare Pages assets
        run: npx --yes wrangler@4 pages deploy frontend/dist --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
