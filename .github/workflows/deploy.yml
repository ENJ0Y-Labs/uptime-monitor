name: Deploy APIMON

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "frontend/**"
      - "docs/DEPLOYMENT.md"
      - ".github/workflows/deploy.yml"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apimon-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Worker and dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            frontend/package-lock.json
      - name: Test Worker
        run: |
          npm ci
          npm test
        working-directory: worker
      - name: Test and build dashboard
        run: |
          npm ci
          npm test
          npm run build
        working-directory: frontend
        env:
          VITE_APIMON_API_BASE_URL: https://apimon-api.invalid

  deploy-worker:
    name: Deploy Worker and production D1
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - name: Validate production configuration
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APIMON_API_TOKEN: ${{ secrets.APIMON_API_TOKEN }}
          APIMON_ALLOWED_EMAILS: ${{ secrets.APIMON_ALLOWED_EMAILS }}
          APIMON_ALLOWED_ORIGIN: ${{ vars.APIMON_ALLOWED_ORIGIN }}
          APIMON_API_BASE_URL: ${{ vars.APIMON_API_BASE_URL }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID variable"; exit 1; }
          test -n "$APIMON_API_TOKEN" || { echo "Missing APIMON_API_TOKEN secret"; exit 1; }
          test "${#APIMON_API_TOKEN}" -ge 32 || { echo "APIMON_API_TOKEN must contain at least 32 characters"; exit 1; }
          test -n "$APIMON_ALLOWED_EMAILS" || { echo "Missing APIMON_ALLOWED_EMAILS secret"; exit 1; }
          test -n "$APIMON_ALLOWED_ORIGIN" || { echo "Missing APIMON_ALLOWED_ORIGIN variable"; exit 1; }
          test -n "$APIMON_API_BASE_URL" || { echo "Missing APIMON_API_BASE_URL variable"; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT_NAME" || { echo "Missing CLOUDFLARE_PAGES_PROJECT_NAME variable"; exit 1; }
          node --input-type=module -e 'for (const key of ["APIMON_ALLOWED_ORIGIN", "APIMON_API_BASE_URL"]) { const value = process.env[key]; const url = new URL(value); if (url.protocol !== "https:" || url.origin !== value) throw new Error(key + " must be an HTTPS origin without a path or trailing slash"); }'
      - name: Apply production D1 migrations
        run: npm run db:migrate:remote
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APIMON_API_TOKEN: ${{ secrets.APIMON_API_TOKEN }}
          APIMON_ALLOWED_EMAILS: ${{ secrets.APIMON_ALLOWED_EMAILS }}
          APIMON_ALLOWED_ORIGIN: ${{ vars.APIMON_ALLOWED_ORIGIN }}
        run: |
          set -euo pipefail
          printf '%s' "$APIMON_API_TOKEN" | npx wrangler secret put APIMON_API_TOKEN --config wrangler.toml
          printf '%s' "$APIMON_ALLOWED_EMAILS" | npx wrangler secret put APIMON_ALLOWED_EMAILS --config wrangler.toml
          printf '%s' "$APIMON_ALLOWED_ORIGIN" | npx wrangler secret put APIMON_ALLOWED_ORIGIN --config wrangler.toml
      - name: Deploy monitoring Worker
        run: npm run deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    name: Build and publish dashboard to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-worker
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build dashboard with public API origin
        run: npm run build
        working-directory: frontend
        env:
          VITE_APIMON_API_BASE_URL: ${{ vars.APIMON_API_BASE_URL }}
      - name: Publish Cloudflare Pages assets
        run: npx --yes wrangler@4 pages deploy frontend/dist --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
